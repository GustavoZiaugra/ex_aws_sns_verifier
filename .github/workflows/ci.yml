name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["26", "27", "28"]
        elixir: ["1.16", "1.17", "1.18", "1.19"]
        exclude:
          - otp: "28"
            elixir: "1.16"
          - otp: "28"
            elixir: "1.17"
        include:
          - otp: "29"
            elixir: "1.20"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix dialyzer

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - name: Install dependencies
        run: mix deps.get --check-locked
      - name: Reject project-level advisory ignores
        run: |
          if grep -n "ignore_advisories" mix.exs; then
            echo "::error file=mix.exs::ignore_advisories is not allowed in CI; fix the dependency instead."
            exit 1
          fi
      - name: Audit dependencies for known CVEs
        run: mix hex.audit
